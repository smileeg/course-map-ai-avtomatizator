<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта курсу</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ЗМІННІ — кольори, розміри
   Якщо хочеш змінити кольори — міняй тут
   ============================================================ */
:root {
  --col-width: 280px;

  /* Статуси */
  --ok:       #2d6a4f; --ok-bg:     #d8eadf; --ok-border:  #b8d8c3; /* OK — зелений */
  --chg:      #7a5a18; --chg-bg:    #f3dfaa; --chg-border: #dfc06a; /* Змінити — жовтий */
  --new:      #285f8f; --new-bg:    #d6e7f5; --new-border: #aacbe8; /* Нове — синій */
  --rev:      #8a4b42; --rev-bg:    #f5d7d3; --rev-border: #e8b8b1; /* Перевірити — рожево-червоний */

  /* Модулі — кольори колонок (додай більше якщо є більше 9 модулів) */
  --m1: #1a5276; --m1l: #d6eaf8;
  --m2: #1e4d2b; --m2l: #d5f5e3;
  --m3: #6b1a3a; --m3l: #fce4ec;
  --m4: #5c3d00; --m4l: #fff8e1;
  --m5: #3d1e6b; --m5l: #ede7f6;
  --m6: #1a4a4a; --m6l: #d0f0f0;
  --m7: #4a1a00; --m7l: #ffe5d0;
  --m8: #2d2d00; --m8l: #fffacc;
  --m9: #1a1a4a; --m9l: #e0e0ff;

  --gray:   #f8f8f6;
  --border: #e5e3df;
  --text:   #1a1a18;
  --muted:  #6b6964;
  --bg:     #fafaf8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  min-height: 100vh;
}

/* ============================================================
   ЕКРАН ЛОГІНУ
   ============================================================ */
#login-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
.login-box {
  width: 340px;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 32px;
  background: #fff;
  box-shadow: 0 4px 24px rgba(0,0,0,.06);
}
.login-title {
  font-family: 'Fraunces', serif;
  font-size: 22px; font-weight: 600;
  margin-bottom: 6px;
}
.login-sub {
  font-size: 12px; color: var(--muted);
  margin-bottom: 24px;
}
.login-input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; color: var(--text);
  background: var(--gray);
  margin-bottom: 12px;
  outline: none;
  transition: border-color .15s;
}
.login-input:focus { border-color: #1a1a18; background: #fff; }
.login-btn {
  width: 100%; padding: 10px;
  background: #1a1a18; color: #fff;
  border: none; border-radius: 8px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; cursor: pointer;
  transition: opacity .15s;
}
.login-btn:hover { opacity: .85; }
.login-error {
  color: #c0392b; font-size: 12px;
  margin-top: 10px; display: none;
}

/* ============================================================
   ЗАВАНТАЖЕННЯ
   ============================================================ */
#loading-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: none;
  align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
  z-index: 999;
}
.loading-spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--text);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 12px; color: var(--muted); }

/* ============================================================
   ТУЛБАР
   ============================================================ */
#app { display: none; }

.toolbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250,250,248,.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.toolbar-title {
  font-family: 'Fraunces', serif;
  font-size: 15px; font-weight: 600;
}
.sep { width: 1px; height: 20px; background: var(--border); }
.f-label { font-size: 11px; color: var(--muted); }
.fbtn {
  font-size: 11px; font-family: 'DM Mono', monospace;
  padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent; cursor: pointer;
  color: var(--muted); transition: all .15s;
}
.fbtn:hover { background: var(--gray); color: var(--text); }
.fbtn.on { background: #1a1a18; color: #fff; border-color: #1a1a18; }

/* Кнопка оновити */
.refresh-btn {
  margin-left: auto;
  font-size: 11px; font-family: 'DM Mono', monospace;
  padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent; cursor: pointer;
  color: var(--muted); transition: all .15s;
  display: flex; align-items: center; gap: 5px;
}
.refresh-btn:hover { background: var(--gray); color: var(--text); }
.refresh-btn.spinning svg { animation: spin .7s linear infinite; }

/* Легенда */
.legend { display: flex; gap: 12px; flex-wrap: wrap; }
.leg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); }
.ldot { width: 7px; height: 7px; border-radius: 50%; }

/* ============================================================
   СТАТИСТИКА
   ============================================================ */
.statsbar {
  padding: 8px 20px;
  display: flex; gap: 20px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat-n { font-family: 'Fraunces', serif; font-size: 20px; line-height: 1; }
.stat-l { font-size: 10px; color: var(--muted); letter-spacing: .3px; }

/* ============================================================
   ДОШКА (горизонтальний скрол)
   ============================================================ */
.board-wrap { overflow-x: auto; padding: 16px 20px 40px; }
.board { display: flex; gap: 12px; align-items: flex-start; min-width: max-content; }

/* ============================================================
   КОЛОНКА МОДУЛЯ
   ============================================================ */
.mod-col { width: var(--col-width); flex-shrink: 0; }

.mod-header {
  border-radius: 10px 10px 0 0;
  padding: 12px 14px 10px;
  border: 1px solid var(--border); border-bottom: none;
}
.mod-tag {
  font-family: 'DM Mono', monospace;
  font-size: 9px; letter-spacing: 1px; text-transform: uppercase;
  opacity: .7; margin-bottom: 4px;
}

/* Назва модуля — клікабельна для редагування */
.mod-name {
  font-family: 'Fraunces', serif;
  font-size: 15px; font-weight: 600; line-height: 1.25;
  margin-bottom: 4px;
  cursor: pointer;
  border-radius: 4px;
  padding: 1px 3px; margin-left: -3px;
  transition: background .12s;
}
.mod-name:hover { background: rgba(255,255,255,.3); }

.mod-desc {
  font-size: 10px; opacity: .7; line-height: 1.4;
  cursor: pointer; border-radius: 4px;
  padding: 1px 3px; margin-left: -3px;
  transition: background .12s;
}
.mod-desc:hover { background: rgba(255,255,255,.3); }

.mod-meta { margin-top: 8px; font-size: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.mod-badge {
  padding: 2px 6px; border-radius: 8px;
  font-family: 'DM Mono', monospace; font-size: 9px;
}

.mod-body {
  border: 1px solid var(--border); border-top: none;
  border-radius: 0 0 10px 10px;
  padding: 8px;
  display: flex; flex-direction: column; gap: 6px;
  background: var(--gray);
}

/* ============================================================
   КАРТКА УРОКУ
   ============================================================ */
.les-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
}
.les-head {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 8px 10px; cursor: pointer;
  transition: background .12s;
}
.les-head:hover { background: var(--gray); }
.les-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--muted);
  padding-top: 1px; min-width: 22px;
}
.les-info { flex: 1; }
.les-name {
  font-size: 12px; font-weight: 500; line-height: 1.3;
  cursor: text;
}
.les-count { font-size: 10px; color: var(--muted); margin-top: 2px; }
.les-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* ============================================================
   ПІЛЮЛІ СТАТУСУ
   Клік циклує: OK → Змінити → Нове → Перевірити → OK
   ============================================================ */
.pill {
  font-size: 9px; font-family: 'DM Mono', monospace; font-weight: 500;
  padding: 2px 7px; border-radius: 10px; cursor: pointer;
  white-space: nowrap; border: 1px solid transparent;
  transition: opacity .15s;
  user-select: none;
}
.pill:hover { opacity: .75; }
.p-ok     { background: var(--ok-bg);  color: var(--ok);  border-color: var(--ok-border); }
.p-change { background: var(--chg-bg); color: var(--chg); border-color: var(--chg-border); }
.p-new    { background: var(--new-bg); color: var(--new); border-color: var(--new-border); }
.p-review { background: var(--rev-bg); color: var(--rev); border-color: var(--rev-border); }
/* Статус "зберігається" */
.pill.saving { opacity: .5; pointer-events: none; }
.status-select {
  font-size: 9px; font-family: 'DM Mono', monospace; font-weight: 500;
  border-radius: 10px; border: 1px solid transparent;
  padding: 2px 16px 2px 7px;
  cursor: pointer;
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 9px) calc(50% - 1px), calc(100% - 5px) calc(50% - 1px);
  background-size: 4px 4px, 4px 4px;
  background-repeat: no-repeat;
}
.status-select:focus { outline: none; box-shadow: 0 0 0 2px rgba(26,26,24,.12); }
.status-select.saving { opacity: .5; pointer-events: none; }

.material-type-select {
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  border-radius: 8px;
  border: 1px solid var(--border);
  padding: 2px 18px 2px 7px;
  background: #fff;
  color: var(--text);
  cursor: pointer;
}

.material-type-select:focus {
  outline: none;
  box-shadow: 0 0 0 2px rgba(26,26,24,.10);
}

.material-type-select.saving {
  opacity: .5;
  pointer-events: none;
}
   
.status-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 1px solid transparent;
  flex-shrink: 0;
  margin-top: 4px;
}

.status-dot.p-ok {
  background: #35c46a;
  border-color: #1f9d50;
}

.status-dot.p-change {
  background: #f5b82e;
  border-color: #d89a12;
}

.status-dot.p-new {
  background: #3b9df3;
  border-color: #1f7fd0;
}

.status-dot.p-review {
  background: #f06b63;
  border-color: #d94a42;
}
   
.toggle { font-size: 8px; color: var(--muted); padding-top: 3px; }

/* ============================================================
   ТІЛО УРОКУ (розкривається)
   ============================================================ */
.les-body {
  border-top: 1px solid var(--border);
  padding: 8px 10px;
  display: none; flex-direction: column; gap: 4px;
}
.les-body.open { display: flex; }

.sec-label {
  font-size: 9px; font-family: 'DM Mono', monospace;
  text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); margin-top: 4px; margin-bottom: 2px;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 9px;
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  user-select: none;
  transition: all .12s;
  box-shadow: 0 1px 3px rgba(0,0,0,.03);
}
.section-head:hover {
  filter: brightness(.985);
  transform: translateY(-1px);
}
.section-head.video-section {
  background: #eef6ff;
  border-color: #c9def5;
}
.section-head.material-section {
  background: #fff7e6;
  border-color: #ead29a;
}
.section-title {
  font-size: 10px;
  font-family: 'DM Mono', monospace;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.section-toggle {
  font-size: 10px;
  color: var(--muted);
}
.section-body {
  display: none;
  flex-direction: column;
  gap: 4px;
}
.section-body.open { display: flex; }

/* ============================================================
   РЯДОК ВІДЕО
   ============================================================ */
.vid-row {
  border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px;
  display: flex; flex-direction: column; gap: 3px;
  transition: background .12s;
}
.vid-row:hover { background: var(--gray); }
.vid-row.hidden-item { display: none; }

.vid-top { display: flex; align-items: flex-start; gap: 6px; }
.vid-icon {
  width: 18px; height: 12px; border-radius: 2px;
  background: #e22c2c; display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; margin-top: 1px;
}
.vid-icon::after {
  content: '';
  border-left: 5px solid #fff;
  border-top: 3px solid transparent;
  border-bottom: 3px solid transparent;
  margin-left: 1px;
}

/* Назва відео — клікабельна */
.vid-title {
  font-size: 11px; line-height: 1.4; flex: 1;
  cursor: pointer; border-radius: 3px;
  padding: 1px 2px; margin-left: -2px;
  transition: background .12s;
}
.vid-title:hover { background: var(--border); }

.item-toggle {
  font-size: 9px;
  color: var(--muted);
  padding-top: 2px;
  cursor: pointer;
  user-select: none;
}

.item-details {
  display: none;
  flex-direction: column;
  gap: 4px;
  margin-top: 4px;
}

.item-details.open {
  display: flex;
}

.mat-card {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 8px;
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: background .12s;
}

.mat-card:hover {
  background: var(--gray);
}

.mat-top {
  display: flex;
  align-items: flex-start;
  gap: 6px;
}

.meta-block {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 6px;
  font-size: 10px;
  line-height: 1.35;
  color: var(--muted);
}

.meta-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  flex-shrink: 0;
  padding-top: 1px;
  opacity: .7;
}

.meta-text {
  flex: 1;
  cursor: pointer;
  border-radius: 3px;
  padding: 1px 2px;
  margin-left: -2px;
  transition: background .12s;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.meta-text:hover {
  background: rgba(0,0,0,.06);
}

.check-warn-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--chg-bg);
  border: 1px solid var(--chg-border);
  color: var(--chg);
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  line-height: 12px;
  text-align: center;
  flex-shrink: 0;
  margin-top: 1px;
  cursor: help;
}

.check-block.ok {
  background: var(--ok-bg);
  border-color: var(--ok-border);
  color: var(--ok);
}

.check-block.warn {
  background: var(--chg-bg);
  border-color: var(--chg-border);
  color: var(--chg);
}

.meta-text {
  white-space: pre-wrap;
}

.view-btn.on {
  background: #1a1a18;
  color: #fff;
  border-color: #1a1a18;
}

   
/* YouTube блок */
.yt-block {
  display: flex; align-items: flex-start; gap: 4px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 4px; padding: 3px 6px;
  font-size: 10px; line-height: 1.35;
  color: var(--muted);
}
/* Якщо назви не збігаються — жовтий */
.yt-block.mismatch {
  background: var(--chg-bg);
  border-color: var(--chg-border);
  color: var(--chg);
}
.yt-label {
  font-family: 'DM Mono', monospace;
  font-size: 9px; font-weight: 500;
  flex-shrink: 0; padding-top: 1px; opacity: .7;
}
.yt-text {
  flex: 1; cursor: pointer; border-radius: 3px;
  padding: 1px 2px; margin-left: -2px;
  transition: background .12s;
}
.yt-text:hover { background: rgba(0,0,0,.06); }
.warn { font-size: 9px; font-style: italic; opacity: .7; }

/* YT посилання */
.yt-url-row {
  display: flex; align-items: center; gap: 4px;
  font-size: 10px; color: var(--muted);
}
.yt-url-link { color: var(--rev); text-decoration: none; font-size: 10px; }
.yt-url-link:hover { text-decoration: underline; }
.yt-url-edit {
  font-size: 9px; color: var(--muted); cursor: pointer;
  opacity: 0; transition: opacity .15s;
}
.vid-row:hover .yt-url-edit { opacity: 1; }

/* Примітка */
.note-tag {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 9px; color: var(--muted);
  background: var(--gray); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px;
  cursor: pointer;
}
.note-tag:hover { background: var(--border); }

/* ============================================================
   МАТЕРІАЛИ
   ============================================================ */
.mat-row {
  display: flex; align-items: center; gap: 6px;
  padding: 3px 4px;
}
.mat-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--muted);
  min-width: 18px;
}
.mat-ico { font-size: 11px; }
.mat-name { font-size: 11px; flex: 1; color: var(--muted); cursor: pointer; }
.mat-name:hover { color: var(--text); }

/* ============================================================
   КНОПКИ ДОДАТИ
   ============================================================ */
.add-btn {
  width: 100%; font-size: 10px; font-family: 'DM Sans', sans-serif;
  color: var(--muted); padding: 4px;
  border: 1px dashed var(--border);
  border-radius: 5px; background: none; cursor: pointer;
  text-align: center; margin-top: 2px; transition: all .12s;
}
.add-btn:hover { background: var(--gray); color: var(--text); border-style: solid; }

.add-mod-btn {
  width: 160px; flex-shrink: 0;
  align-self: flex-start; margin-top: 0;
  font-size: 11px; font-family: 'DM Sans', sans-serif;
  color: var(--muted); padding: 12px;
  border: 1px dashed var(--border);
  border-radius: 10px; background: none; cursor: pointer;
  text-align: center; transition: all .12s;
}
.add-mod-btn:hover { background: var(--gray); color: var(--text); }

/* ============================================================
   INLINE РЕДАГУВАННЯ — поле вводу прямо в картці
   ============================================================ */
.inline-edit {
  width: 100%; font-size: inherit; font-family: inherit;
  border: 1px solid #1a1a18; border-radius: 4px;
  padding: 2px 5px; background: #fff; color: var(--text);
  outline: none; line-height: inherit;
}

/* ============================================================
   МОДАЛЬНЕ ВІКНО — для додавання нових записів
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 500; opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: #fff; border-radius: 12px;
  padding: 24px; width: 360px;
  box-shadow: 0 8px 40px rgba(0,0,0,.15);
  transform: translateY(10px); transition: transform .2s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-title {
  font-family: 'Fraunces', serif;
  font-size: 16px; font-weight: 600;
  margin-bottom: 16px;
}
.modal-field { margin-bottom: 12px; }
.modal-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: block; }
.modal-input {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 6px;
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  background: var(--gray); color: var(--text);
  outline: none; transition: border-color .15s;
}
.modal-input:focus { border-color: #1a1a18; background: #fff; }
.modal-select {
  width: 100%; padding: 8px 10px;
  border: 1px solid var(--border); border-radius: 6px;
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  background: var(--gray); color: var(--text);
  outline: none; cursor: pointer;
}
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal-cancel {
  padding: 7px 16px; border-radius: 6px;
  border: 1px solid var(--border); background: none;
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  cursor: pointer; color: var(--muted);
}
.modal-save {
  padding: 7px 16px; border-radius: 6px;
  border: none; background: #1a1a18; color: #fff;
  font-family: 'DM Sans', sans-serif; font-size: 13px;
  cursor: pointer; transition: opacity .15s;
}
.modal-save:hover { opacity: .85; }
.modal-save:disabled { opacity: .5; cursor: not-allowed; }

/* Тост — повідомлення про збереження */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: #1a1a18; color: #fff;
  padding: 8px 16px; border-radius: 8px;
  font-size: 12px; z-index: 999;
  opacity: 0; transform: translateY(8px);
  transition: all .2s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { background: #c0392b; }
</style>
</head>
<body>

<!-- ============================================================
     ЕКРАН ЛОГІНУ
     ============================================================ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-title">Карта курсу</div>
    <div class="login-sub">Введи пароль для входу</div>
    <input type="password" class="login-input" id="login-pwd" placeholder="Пароль" />
    <button class="login-btn" id="login-btn">Увійти</button>
    <div class="login-error" id="login-error">Невірний пароль</div>
  </div>
</div>

<!-- Екран завантаження -->
<div id="loading-screen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Завантажую дані з Notion...</div>
</div>

<!-- ============================================================
     ОСНОВНИЙ ІНТЕРФЕЙС
     ============================================================ -->
<div id="app">

  <!-- Тулбар -->
  <div class="toolbar">
    <span class="toolbar-title">Карта курсу</span>
    <div class="sep"></div>
    <span class="f-label">Фільтр відео:</span>
    <button class="fbtn on" onclick="setFilter('all', this)">Всі</button>
    <button class="fbtn" onclick="setFilter('OK', this)">OK</button>
    <button class="fbtn" onclick="setFilter('Змінити', this)">Змінити</button>
    <button class="fbtn" onclick="setFilter('Нове', this)">Нові</button>
    <button class="fbtn" onclick="setFilter('Перевірити', this)">Перевірити</button>
    <div class="sep"></div>
    <div class="legend">
      <span class="leg"><span class="ldot" style="background:var(--ok)"></span>OK</span>
      <span class="leg"><span class="ldot" style="background:var(--chg)"></span>Змінити</span>
      <span class="leg"><span class="ldot" style="background:var(--new)"></span>Нове</span>
      <span class="leg"><span class="ldot" style="background:var(--rev)"></span>Перевірити</span>
    </div>
    <div class="sep"></div>
    <span class="f-label">Вигляд:</span>
    <button class="fbtn view-btn on" id="view-compact" onclick="setViewMode('compact')">Компактний</button>
    <button class="fbtn view-btn" id="view-detail" onclick="setViewMode('detail')">Детальний</button>
    <div class="sep"></div>
    <button class="fbtn" onclick="expandAll()">Розгорнути все</button>
    <button class="fbtn" onclick="collapseAll()">Згорнути все</button>
    <button class="refresh-btn" id="refresh-btn" onclick="loadData()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M1 4v6h6M23 20v-6h-6"/>
        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"/>
      </svg>
      Оновити з Notion
    </button>
  </div>

  <!-- Статистика -->
  <div class="statsbar" id="statsbar"></div>

  <!-- Дошка модулів -->
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

</div>

<!-- Тост повідомлення -->
<div class="toast" id="toast"></div>

<!-- Модальне вікно -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Додати</div>
    <div id="modal-fields"></div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Скасувати</button>
      <button class="modal-save" id="modal-save" onclick="saveModal()">Зберегти</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// НАЛАШТУВАННЯ
// ⚙️ ВАЖЛИВО: встав URL свого Cloudflare Worker сюди
// Після деплою Worker він виглядатиме так:
// https://course-map.YOUR-NAME.workers.dev
// ============================================================
const WORKER_URL = "https://course-map.palchikovaolesya.workers.dev"; // ← ЗАМІНИТИ

// ============================================================
// Статуси — порядок циклу при кліку
// Якщо додаєш новий статус в Notion — додай його сюди теж
// ============================================================
const STATUS_CYCLE = {
  "OK":         "Змінити",
  "Змінити":    "Нове",
  "Нове":       "Перевірити",
  "Перевірити":  "OK",
};

const STATUS_CLASS = {
  "OK":        "p-ok",
  "Змінити":   "p-change",
  "Нове":      "p-new",
  "Перевірити": "p-review",
};
const STATUS_OPTIONS = ["Перевірити", "OK", "Змінити", "Нове"];

// Кольори колонок модулів (за порядком)
const MOD_COLORS = [
  { bg:"var(--m1l)", color:"var(--m1)" },
  { bg:"var(--m2l)", color:"var(--m2)" },
  { bg:"var(--m3l)", color:"var(--m3)" },
  { bg:"var(--m4l)", color:"var(--m4)" },
  { bg:"var(--m5l)", color:"var(--m5)" },
  { bg:"var(--m6l)", color:"var(--m6)" },
  { bg:"var(--m7l)", color:"var(--m7)" },
  { bg:"var(--m8l)", color:"var(--m8)" },
  { bg:"var(--m9l)", color:"var(--m9)" },
];

// ============================================================
// СТАН ДОДАТКУ
// ============================================================
let DATA = { modules: [], lessons: [], videos: [], materials: [] };
let currentFilter = "all";
let viewMode = localStorage.getItem("courseMapViewMode") || "compact";
let modalCallback = null; // функція яка викликається при збереженні модалки

// ============================================================
// API — запити до Worker
// ============================================================
async function api(method, path, body = null) {
  const res = await fetch(WORKER_URL + path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : null,
  });
  return res.json();
}

// ============================================================
// ЛОГІН
// ============================================================
document.getElementById("login-btn").addEventListener("click", async () => {
  const pwd = document.getElementById("login-pwd").value;
  if (!pwd) return;

  const btn = document.getElementById("login-btn");
  btn.textContent = "Завантаження...";
  btn.disabled = true;

  const res = await api("POST", "/login", { password: pwd });

  if (res.ok) {
    document.getElementById("login-screen").style.display = "none";
    await loadData();
  } else {
    document.getElementById("login-error").style.display = "block";
    btn.textContent = "Увійти";
    btn.disabled = false;
  }
});

// Enter у полі пароля
document.getElementById("login-pwd").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("login-btn").click();
});

// ============================================================
// ЗАВАНТАЖЕННЯ ДАНИХ
// ============================================================
async function loadData(preserveState = true) {
  const openState = preserveState ? getOpenState() : null;

  showLoading(true);

  const btn = document.getElementById("refresh-btn");
  if (btn) btn.classList.add("spinning");

  const res = await api("GET", "/data");
  DATA = normalizeData(res);

  document.getElementById("app").style.display = "block";
  showLoading(false);
  if (btn) btn.classList.remove("spinning");

  buildBoard();
  buildStats();

  restoreOpenState(openState);
  applyViewMode();
}

function showLoading(show) {
  document.getElementById("loading-screen").style.display = show ? "flex" : "none";
}

// ============================================================
// ПОБУДОВА ДОШКИ
// ============================================================
function buildBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  // Сортуємо модулі за порядком
  const sortedMods = [...DATA.modules].sort((a, b) => (a.order || 0) - (b.order || 0));

  sortedMods.forEach((mod, idx) => {
    const col = buildModule(mod, idx);
    board.appendChild(col);
  });

  // Кнопка додати модуль (поки не активна — додавання модулів через Notion)
  const addBtn = document.createElement("button");
  addBtn.className = "add-mod-btn";
  addBtn.textContent = "+ модуль (в Notion)";
  addBtn.title = "Нові модулі додаються напряму в Notion";
  board.appendChild(addBtn);

  applyFilter();
}

// Будуємо колонку одного модуля
function buildModule(mod, colorIdx) {
  const c = MOD_COLORS[colorIdx % MOD_COLORS.length];

  // Уроки цього модуля, відсортовані
  const lessons = DATA.lessons
    .filter(l => l.moduleId === mod.id)
    .sort((a, b) => (a.order || 0) - (b.order || 0));

  const totalVids = lessons.reduce((s, l) =>
    s + DATA.videos.filter(v => v.lessonId === l.id).length, 0);
  const issues = lessons.reduce((s, l) =>
    s + DATA.videos.filter(v => v.lessonId === l.id && v.status !== "OK").length, 0);
  const col = document.createElement("div");
  col.className = "mod-col";
  col.innerHTML = `
    <div class="mod-header" style="background:${c.bg};color:${c.color}">
      <div class="mod-tag">Модуль ${mod.order || colorIdx + 1}</div>
      <div class="mod-name" title="Клікни для редагування"
           onclick="editText(this, '${mod.id}', 'modules', 'name')">${escHtml(mod.name)}</div>
      <div class="mod-desc" title="Клікни для редагування"
           onclick="editText(this, '${mod.id}', 'modules', 'desc')">${escHtml(mod.desc || "Додати опис...")}</div>
      <div class="mod-meta">
        ${buildStatusSelectHTML(mod.id, "modules", mod.status, true)}
        <span class="mod-badge" style="background:rgba(255,255,255,.5);color:${c.color}">${totalVids} відео</span>
        ${issues ? `<span class="mod-badge" style="background:var(--chg-bg);color:var(--chg)">${issues} ⚠</span>` : ""}
      </div>
    </div>
    <div class="mod-body" id="mbd_${mod.id}">
      ${lessons.map(l => buildLessonHTML(l)).join("")}
      <button class="add-btn" onclick="openAddLesson('${mod.id}')">+ урок</button>
    </div>
  `;
  return col;
}

// HTML картки уроку
function buildLessonHTML(les) {
  const videos = DATA.videos
    .filter(v => v.lessonId === les.id)
    .sort((a, b) => ((a.order ?? a.number) || 0) - ((b.order ?? b.number) || 0));
  const mats = DATA.materials
    .filter(m => m.lessonId === les.id)
    .sort((a, b) => ((a.order ?? a.number) || 0) - ((b.order ?? b.number) || 0));

  const issues = videos.filter(v => v.status !== "OK").length;
  const sub = [
    `${videos.length} відео`,
    issues ? `${issues} потребують уваги` : "",
  ].filter(Boolean).join(" · ");

  return `<div class="les-card" id="lc_${les.id}">
    <div class="les-head" onclick="toggleLesson('${les.id}')">
      <span class="les-num">${les.order || ""}</span>
      <div class="les-info">
        <div class="les-name"
             onclick="event.stopPropagation(); editText(this, '${les.id}', 'lessons', 'name')"
             title="Клікни для редагування назви">${escHtml(les.name)}</div>
        <div class="les-count">${sub}</div>
        ${les.note ? `<span class="note-tag" onclick="event.stopPropagation(); editNote('${les.id}', 'lessons')">📝 ${escHtml(les.note)}</span>` : ""}
      </div>
      <div class="les-right">
        ${buildStatusSelectHTML(les.id, "lessons", les.status, true)}
        <span class="toggle" id="tog_${les.id}">▶</span>
      </div>
    </div>
    <div class="les-body" id="lb_${les.id}">
      <div class="section-head video-section" onclick="toggleSection('${les.id}', 'videos')">
        <span class="section-title">🎬 Відео (${videos.length})</span>
        <span class="section-toggle" id="st_${les.id}_videos">▶</span>
      </div>
      <div class="section-body" id="sb_${les.id}_videos">
        ${videos.map(v => buildVideoHTML(v)).join("")}
        <button class="add-btn" onclick="openAddVideo('${les.id}')">+ відео</button>
      </div>

      <div class="section-head material-section" onclick="toggleSection('${les.id}', 'materials')">
        <span class="section-title">📎 Матеріали (${mats.length})</span>
        <span class="section-toggle" id="st_${les.id}_materials">▶</span>
      </div>
      <div class="section-body" id="sb_${les.id}_materials">
        ${mats.map(m => buildMaterialHTML(m)).join("")}
        <button class="add-btn" onclick="openAddMaterial('${les.id}')">+ матеріал</button>
      </div>

      ${!les.note ? `<button class="add-btn" style="margin-top:4px" onclick="editNote('${les.id}', 'lessons')">+ примітка до уроку</button>` : ""}
    </div>
  </div>`;
}

// HTML рядка відео
function buildVideoHTML(v) {
  const ytName = v.ytName || "";
  const itemId = `video_${v.id}`;
  const check = getVideoTitleCheck(v);
  const checkIcon = check.ok
    ? ""
    : `<span class="check-warn-dot" title="${escHtml(check.message)}">!</span>`;
  const detailsClass = viewMode === "detail" ? "item-details open" : "item-details";
  const toggleText = viewMode === "detail" ? "▼" : "▶";

  return `<div class="vid-row" data-vid="${v.id}" data-status="${v.status || ""}">
    <div class="vid-top">
      <span class="mat-num">${v.order ?? v.number ?? ""}</span>

      <span class="vid-title"
            onclick="editText(this, '${v.id}', 'videos', 'name')"
            title="Клікни для редагування">${escHtml(v.name)}</span>

      ${checkIcon}
      ${buildStatusDotHTML(v.status)}

      <span class="item-toggle" id="it_${itemId}"
            onclick="event.stopPropagation(); toggleItemDetails('${itemId}')">${toggleText}</span>
    </div>

    <div class="${detailsClass}" id="id_${itemId}">
      <div class="meta-block">
        <span class="meta-label">Статус:</span>
        ${buildStatusSelectHTML(v.id, "videos", v.status)}
      </div>

      <div class="meta-block ${check.ok ? "check-block ok" : "check-block warn"}">
        <span class="meta-label">Перевірка:</span>
        <span class="meta-text">${escHtml(check.message)}</span>
      </div>

      <div class="meta-block">
        <span class="meta-label">YT Заставка:</span>
        <span class="meta-text"
              onclick="editText(this, '${v.id}', 'videos', 'ytTitle')"
              title="Клікни для редагування назви на заставці YouTube">${escHtml(v.ytTitle || "— не вказано")}</span>
      </div>

      <div class="meta-block">
        <span class="meta-label">YT Назва:</span>
        <span class="meta-text"
              onclick="editText(this, '${v.id}', 'videos', 'ytName')"
              title="Клікни для редагування назви відео на YouTube">${escHtml(ytName || "— не вказано")}</span>
      </div>

      ${v.note
        ? `<span class="note-tag" onclick="editNote('${v.id}', 'videos')">📝 ${escHtml(v.note)}</span>`
        : `<button class="add-btn" style="font-size:9px;padding:2px" onclick="editNote('${v.id}', 'videos')">+ примітка</button>`}
    </div>
  </div>`;
}

function buildStatusSelectHTML(id, table, status, stopPropagation = false) {
  const current = status || "Перевірити";
  const sc = STATUS_CLASS[current] || "p-review";
  const stop = stopPropagation ? "event.stopPropagation();" : "";
  return `<select class="status-select ${sc}" data-id="${id}" data-table="${table}" onchange="${stop}updateStatus(this)">
    ${STATUS_OPTIONS.map(opt => `<option value="${opt}" ${opt === current ? "selected" : ""}>${opt}</option>`).join("")}
  </select>`;
}

function buildStatusDotHTML(status) {
  const current = status || "Перевірити";
  const sc = STATUS_CLASS[current] || "p-review";
  return `<span class="status-dot ${sc}" title="${escHtml(current)}"></span>`;
}

function buildMaterialTypeSelectHTML(id, type) {
  const current = type || "PDF";
  const options = ["PDF", "xlsx", "docx", "інше"];

  return `<select class="material-type-select" data-id="${id}" onchange="updateMaterialType(this)">
    ${options.map(opt => `<option value="${opt}" ${opt === current ? "selected" : ""}>${opt}</option>`).join("")}
  </select>`;
}
   
// HTML рядка матеріалу
function buildMaterialHTML(m) {
  const typeIcons = {
    "PDF": "📕",
    "xlsx": "📊",
    "docx": "📄",
    "інше": "📎"
  };

  const icon = typeIcons[m.type] || "📎";
  const itemId = `material_${m.id}`;
  const detailsClass = viewMode === "detail" ? "item-details open" : "item-details";
  const toggleText = viewMode === "detail" ? "▼" : "▶";

  return `<div class="mat-card" data-mat="${m.id}" data-status="${m.status || ""}">
    <div class="mat-top">
      <span class="mat-num">${m.order ?? m.number ?? ""}</span>
      <span class="mat-ico">${icon}</span>

      <span class="mat-name"
            onclick="editText(this, '${m.id}', 'materials', 'name')"
            title="Клікни для редагування">${escHtml(m.name)}</span>

      ${buildStatusDotHTML(m.status)}

      <span class="item-toggle" id="it_${itemId}"
            onclick="event.stopPropagation(); toggleItemDetails('${itemId}')">${toggleText}</span>
    </div>

    <div class="${detailsClass}" id="id_${itemId}">
      <div class="meta-block">
        <span class="meta-label">Статус:</span>
        ${buildStatusSelectHTML(m.id, "materials", m.status)}
      </div>

      <div class="meta-block">
        <span class="meta-label">Тип:</span>
        ${buildMaterialTypeSelectHTML(m.id, m.type)}
      </div>

      ${m.note
        ? `<span class="note-tag" onclick="editNote('${m.id}', 'materials')">📝 ${escHtml(m.note)}</span>`
        : `<button class="add-btn" style="font-size:9px;padding:2px" onclick="editNote('${m.id}', 'materials')">+ примітка</button>`}
    </div>
  </div>`;
}

// ============================================================
// СТАТИСТИКА
// ============================================================
function buildStats() {
  const allVids = DATA.videos;
  const counts = { "OK": 0, "Змінити": 0, "Нове": 0, "Перевірити": 0 };
  const moduleCounts = { "OK": 0, "Змінити": 0, "Нове": 0, "Перевірити": 0 };
  allVids.forEach(v => { if (counts[v.status] !== undefined) counts[v.status]++; });
  DATA.modules.forEach(m => { const st = m.status || "Перевірити"; if (moduleCounts[st] !== undefined) moduleCounts[st]++; });
  const titleIssues = allVids.filter(v => !getVideoTitleCheck(v).ok).length;
  document.getElementById("statsbar").innerHTML = `
    <div class="stat"><span class="stat-n">${DATA.modules.length}</span><span class="stat-l">Модулі</span></div>
    <div class="stat"><span class="stat-n" style="color:var(--rev)">${moduleCounts["Перевірити"]}</span><span class="stat-l">Модулі: перевірити</span></div>
    <div class="stat"><span class="stat-n">${DATA.lessons.length}</span><span class="stat-l">Уроки</span></div>
    <div class="stat"><span class="stat-n">${allVids.length}</span><span class="stat-l">Відео</span></div>
    <div class="stat"><span class="stat-n" style="color:var(--ok)">${counts["OK"]}</span><span class="stat-l">OK</span></div>
    <div class="stat"><span class="stat-n" style="color:var(--chg)">${counts["Змінити"]}</span><span class="stat-l">Змінити</span></div>
    <div class="stat"><span class="stat-n" style="color:var(--new)">${counts["Нове"]}</span><span class="stat-l">Нові</span></div>
    <div class="stat"><span class="stat-n" style="color:var(--rev)">${counts["Перевірити"]}</span><span class="stat-l">Перевірити</span></div>
    <div class="stat"><span class="stat-n" style="color:var(--chg)">${titleIssues}</span><span class="stat-l">Назва не в YT</span></div>
    <div class="stat"><span class="stat-n">${DATA.materials.length}</span><span class="stat-l">Матеріали</span></div>
  `;
}

// ============================================================
// РОЗКРИТИ/ЗАКРИТИ УРОК
// ============================================================
function toggleLesson(id) {
  const body = document.getElementById("lb_" + id);
  const tog  = document.getElementById("tog_" + id);
  const open = body.classList.toggle("open");
  tog.textContent = open ? "▼" : "▶";
}

function toggleSection(lessonId, section) {
  const body = document.getElementById(`sb_${lessonId}_${section}`);
  const tog  = document.getElementById(`st_${lessonId}_${section}`);
  if (!body || !tog) return;
  const open = body.classList.toggle("open");
  tog.textContent = open ? "▼" : "▶";
}

function toggleItemDetails(itemId) {
  const body = document.getElementById("id_" + itemId);
  const tog = document.getElementById("it_" + itemId);

  if (!body || !tog) return;

  const open = body.classList.toggle("open");
  tog.textContent = open ? "▼" : "▶";
}


function setOpen(el, toggle, open) {
  if (!el) return;
  el.classList.toggle("open", open);
  if (toggle) toggle.textContent = open ? "▼" : "▶";
}

function expandAll() {
  document.querySelectorAll(".les-body").forEach(el => {
    const id = el.id.replace("lb_", "");
    setOpen(el, document.getElementById("tog_" + id), true);
  });

  document.querySelectorAll(".section-body").forEach(el => {
    const key = el.id.replace("sb_", "");
    setOpen(el, document.getElementById("st_" + key), true);
  });

function stripLeadingNumber(text) {
  return String(text || "")
    .replace(/^\s*(?:№|#)?\s*\d+(?:[\.\)\]\-–—_:]\s*\d+)*[\.\)\]\-–—_:\s]*/u, "")
    .trim();
}

function normalizeForTitleCheck(text) {
  return stripLeadingNumber(text)
    .toLowerCase()
    .replace(/[`'ʼ’‘"“”«»„]/g, "")
    .replace(/[^0-9a-zа-яіїєґ\s]+/giu, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function includesNormalizedTitle(haystack, needle) {
  const h = normalizeForTitleCheck(haystack);
  const n = normalizeForTitleCheck(needle);
  return Boolean(n) && h.includes(n);
}

function getVideoTitleCheck(v) {
  const base = stripLeadingNumber(v?.name || "");
  const normalizedBase = normalizeForTitleCheck(base);
  const missing = [];

  if (!normalizedBase) {
    return { ok: true, base: "", message: "Назва відео без початкового номера порожня." };
  }

  if (!includesNormalizedTitle(v?.ytTitle || "", base)) missing.push("YT Заставка");
  if (!includesNormalizedTitle(v?.ytName || "", base)) missing.push("YT Назва");

  if (!missing.length) {
    return {
      ok: true,
      base,
      message: `OK: “${base}” є в YT Заставці та YT Назві.`,
    };
  }

  return {
    ok: false,
    base,
    message: `Немає тексту “${base}” у: ${missing.join(", ")}.`,
  };
}

async function cycleStatus(el) {
  const id    = el.dataset.id;
  const table = el.dataset.table;
  const cur   = el.textContent.trim();
  const next  = STATUS_CYCLE[cur] || "Перевірити";

  // Одразу міняємо UI (оптимістично)
  el.textContent = next;
  Object.values(STATUS_CLASS).forEach(c => el.classList.remove(c));
  el.classList.add(STATUS_CLASS[next] || "p-review");
  el.classList.add("saving");

  // Оновлюємо локальні дані
  const record = findRecord(table, id);
  if (record) record.status = next;

  // Оновлюємо data-status для фільтра
  const vidRow = document.querySelector(`.vid-row[data-vid="${id}"]`);
  if (vidRow) { vidRow.dataset.status = next; applyFilter(); }

  // Зберігаємо в Notion
  const res = await api("PATCH", "/update", { pageId: id, table, field: "status", value: next });
  el.classList.remove("saving");

  if (res.ok) {
    showToast("Збережено ✓");
    buildStats(); // оновлюємо лічильники
  } else {
    showToast("Помилка збереження", true);
    // Відкатуємо
    el.textContent = cur;
    Object.values(STATUS_CLASS).forEach(c => el.classList.remove(c));
    el.classList.add(STATUS_CLASS[cur] || "p-review");
    if (record) record.status = cur;
  }
}

// ============================================================
// INLINE РЕДАГУВАННЯ ТЕКСТУ
// Клік → поле вводу → Enter або blur → зберегти в Notion
// ============================================================
function editText(el, id, table, field) {
  if (el.querySelector("input, textarea")) return; // вже редагується

  const original = el.dataset.value || el.textContent.trim()
    .replace(" ⚠ не збігається", "").trim();

  const isMultiline = table === "videos" && field === "ytTitle";
  const input = isMultiline ? document.createElement("textarea") : document.createElement("input");

  if (isMultiline) {
    input.rows = 4;
    input.style.resize = "vertical";
    input.style.minHeight = "70px";
    input.title = "Enter — новий рядок, Ctrl+Enter — зберегти";
  } else {
    input.type = "text";
  }

  input.className = "inline-edit";
  input.value = original;
  input.style.fontSize = window.getComputedStyle(el).fontSize;

  el.innerHTML = "";
  el.appendChild(input);
  input.focus();
  input.select();

  async function save() {
    const newVal = input.value.trim();
    el.dataset.value = newVal;

    if (newVal === original) {
      // Нічого не змінилось — просто відновити
      rebuildElement(el, id, table, field, original);
      return;
    }

    el.textContent = newVal + " ...";

    const res = await api("PATCH", "/update", { pageId: id, table, field, value: newVal });

    // Оновлюємо локальні дані
    const record = findRecord(table, id);
    if (record) record[field] = newVal;

    if (res.ok) {
      showToast("Збережено ✓");
      // Перебудовуємо тільки картку уроку або відео (не всю дошку)
      refreshCard(id, table);
    } else {
      showToast("Помилка збереження", true);
      rebuildElement(el, id, table, field, original);
    }
  }

  input.addEventListener("blur", save);
  input.addEventListener("keydown", e => {
    if (!isMultiline && e.key === "Enter") { e.preventDefault(); input.blur(); }
    if (isMultiline && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); input.blur(); }
    if (e.key === "Escape") { input.removeEventListener("blur", save); rebuildElement(el, id, table, field, original); }
  });
}

function openModal(title, fields, callback) {
  document.getElementById("modal-title").textContent = title;
  modalCallback = callback;

  const container = document.getElementById("modal-fields");
  container.innerHTML = fields.map(f => {
    if (f.type === "select") {
      return `<div class="modal-field">
        <label class="modal-label">${f.label}</label>
        <select class="modal-select" id="mf_${f.id}">
          ${f.options.map(o => {
            const val = typeof o === "object" ? o.value : o;
            const lbl = typeof o === "object" ? o.label : o;
            return `<option value="${escHtml(val)}" ${val === f.value ? "selected" : ""}>${escHtml(lbl)}</option>`;
          }).join("")}
        </select>
      </div>`;
    }
    if (f.type === "textarea") {
      return `<div class="modal-field">
        <label class="modal-label">${f.label}</label>
        <textarea class="modal-input" id="mf_${f.id}" rows="3" style="resize:vertical">${escHtml(f.value || "")}</textarea>
      </div>`;
    }
    const inputType = f.type === "number" ? "number" : "text";
    return `<div class="modal-field">
      <label class="modal-label">${f.label}</label>
      <input type="${inputType}" class="modal-input" id="mf_${f.id}"
             value="${escHtml(f.value || "")}"
             placeholder="${escHtml(f.placeholder || "")}" />
    </div>`;
  }).join("");

  document.getElementById("modal").classList.add("open");

  // Фокус на першому полі
  setTimeout(() => {
    const first = container.querySelector("input, textarea");
    if (first) first.focus();
  }, 100);

// Нормалізація даних з Worker
// Підтримує обидва формати звʼязків:
// - lessonId / moduleId
// - lesson / module
// - Notion relation у вигляді масиву або обʼєкта
function relationId(value) {
  if (!value) return null;
  if (typeof value === "string") return value;
  if (Array.isArray(value)) {
    const first = value[0];
    if (!first) return null;
    if (typeof first === "string") return first;
    return first.id || first.page_id || null;
  }
  if (typeof value === "object") return value.id || value.page_id || null;
  return null;
}

function normalizeData(raw) {
  const data = {
    modules: Array.isArray(raw?.modules) ? raw.modules : [],
    lessons: Array.isArray(raw?.lessons) ? raw.lessons : [],
    videos: Array.isArray(raw?.videos) ? raw.videos : [],
    materials: Array.isArray(raw?.materials) ? raw.materials : [],
  };

  data.modules = data.modules.map(m => ({
    ...m,
    order: toNumber(m.order ?? m.number) ?? 0,
    status: m.status || "Перевірити",
  }));

  data.lessons = data.lessons.map(l => ({
    ...l,
    moduleId: l.moduleId || relationId(l.module) || relationId(l.modules),
    order: toNumber(l.order ?? l.number) ?? 0,
    status: l.status || "Перевірити",
  }));

  data.videos = data.videos.map(v => ({
    ...v,
    lessonId: v.lessonId || relationId(v.lesson) || relationId(v.lessons),
    order: toNumber(v.order ?? v.number) ?? 0,
    ytTitle: v.ytTitle || "",
    ytName: v.ytName || "",
    status: v.status || "Перевірити",
  }));

  data.materials = data.materials.map(m => {
    let lessonId = m.lessonId || relationId(m.lesson) || relationId(m.lessons);

    // Сумісність зі старою схемою: матеріал був привʼязаний до відео
    const videoId = m.videoId || relationId(m.video) || relationId(m.videos);
    if (!lessonId && videoId) {
      const linkedVideo = data.videos.find(v => v.id === videoId);
      lessonId = linkedVideo?.lessonId || null;
    }

    return {
      ...m,
      lessonId,
      videoId,
      order: toNumber(m.order ?? m.number) ?? 0,
      status: m.status || "Перевірити",
    };
  });

  return data;
}

// Знайти запис у локальних даних
function findRecord(table, id) {
  const map = { modules: "modules", lessons: "lessons", videos: "videos", materials: "materials" };
  return DATA[map[table]]?.find(r => r.id === id);
}

// Перебудувати картку після редагування
function refreshCard(id, table) {
  if (table === "lessons" || table === "videos" || table === "materials") {
    // Знаходимо урок
    let lessonId = id;
    if (table === "videos") {
      const v = DATA.videos.find(v => v.id === id);
      lessonId = v?.lessonId;
    }
    if (table === "materials") {
      const m = DATA.materials.find(m => m.id === id);
      lessonId = m?.lessonId;
    }
    if (!lessonId) return;

    const lesson = DATA.lessons.find(l => l.id === lessonId);
    if (!lesson) return;

    const card = document.getElementById("lc_" + lessonId);
    if (!card) return;

    const wasOpen = document.getElementById("lb_" + lessonId)?.classList.contains("open");
   const videosOpen = document.getElementById(`sb_${lessonId}_videos`)?.classList.contains("open");
   const materialsOpen = document.getElementById(`sb_${lessonId}_materials`)?.classList.contains("open");
   
   const openItems = [...document.querySelectorAll(".item-details.open")]
     .map(el => el.id.replace("id_", ""));
   
   card.outerHTML = buildLessonHTML(lesson);
    if (wasOpen) {
      const body = document.getElementById("lb_" + lessonId);
      const tog  = document.getElementById("tog_" + lessonId);
      if (body) body.classList.add("open");
      if (tog)  tog.textContent = "▼";
    }
    if (videosOpen) toggleSection(lessonId, "videos");
    if (materialsOpen) toggleSection(lessonId, "materials");
     openItems.forEach(itemId => {
        const body = document.getElementById("id_" + itemId);
        const tog = document.getElementById("it_" + itemId);
      
        if (body) body.classList.add("open");
        if (tog) tog.textContent = "▼";
      });
    applyFilter();
  }
  if (table === "modules") {
    buildBoard();
    buildStats();
  }
}

// Відновити елемент після скасування редагування
function rebuildElement(el, id, table, field, original) {
  el.textContent = original;
}

function nextOrder(items, field = "order") {
  const nums = items
    .map(item => Number(item[field] ?? item.order ?? item.number))
    .filter(Number.isFinite);
  return nums.length ? Math.max(...nums) + 1 : 1;
}

function toNumber(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function getOpenState() {
  return {
    lessons: [...document.querySelectorAll(".les-body.open")]
      .map(el => el.id.replace("lb_", "")),

    sections: [...document.querySelectorAll(".section-body.open")]
      .map(el => el.id.replace("sb_", "")),

    items: [...document.querySelectorAll(".item-details.open")]
      .map(el => el.id.replace("id_", "")),

    scrollLeft: document.querySelector(".board-wrap")?.scrollLeft || 0,
  };
}

function restoreOpenState(state) {
  if (!state) return;

  state.lessons.forEach(id => {
    const body = document.getElementById("lb_" + id);
    const tog = document.getElementById("tog_" + id);

    if (body) body.classList.add("open");
    if (tog) tog.textContent = "▼";
  });

  state.sections.forEach(key => {
    const body = document.getElementById("sb_" + key);
    const tog = document.getElementById("st_" + key);

    if (body) body.classList.add("open");
    if (tog) tog.textContent = "▼";
  });

  (state.items || []).forEach(key => {
    const body = document.getElementById("id_" + key);
    const tog = document.getElementById("it_" + key);

    if (body) body.classList.add("open");
    if (tog) tog.textContent = "▼";
  });

  const wrap = document.querySelector(".board-wrap");
  if (wrap) wrap.scrollLeft = state.scrollLeft || 0;
}
   
// Безпечний HTML (захист від XSS)
function escHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
